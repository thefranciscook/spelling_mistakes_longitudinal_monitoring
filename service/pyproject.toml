[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spelling-observatory"
version = "0.1.0"
description = "Personal Spelling Observatory: local, N-of-1 longitudinal spelling-error analysis engine"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "symspellpy==6.10.2",
  "spylls==0.1.7",
  "lingua-language-detector==2.2.0",
  "cmudict==1.1.3",
  "g2p_en==2.1.0",            # used only for its pretrained checkpoint; the package is never imported
  "numpy>=1.26",
]

[project.optional-dependencies]
secure = ["sqlcipher3-wheels==0.5.7", "keyring>=25"]
dev = ["pytest>=8"]

[project.scripts]
observatory = "spelling_observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spelling_observatory = ["lexicon/data/*.txt", "store/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
